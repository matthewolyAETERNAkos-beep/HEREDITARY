name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          npm install --legacy-peer-deps

      - name: Prepare icon and cover
        run: |
          convert assets/cover.jpg -crop 736x736+0+230 +repage -resize 1024x1024 assets/icon-only.png
          convert assets/icon-only.png -resize 680x680 -background none -gravity center -extent 1024x1024 assets/icon-foreground.png
          convert -size 1024x1024 xc:'#1b110c' assets/icon-background.png
          convert assets/icon-only.png -resize 512x512 www/cover.jpg

      - name: Add media notification support
        run: |
          npx esbuild src/media.js --bundle --format=iife --outfile=www/media.js
          sed -i '0,/<head>/s//<head><script src="media.js"><\/script>/' www/index.html

      - name: Create Android project
        run: |
          npx cap add android
          npx --yes @capacitor/assets generate --android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Scoiatael-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
